[project]
name = "triage"
version = "0.1.0"
description = "Production-grade GitHub issue triage agent built with LangGraph, with a golden eval set, tracing and guardrails"
readme = "README.md"
authors = [
    { name = "aranya-chatterjee", email = "chatterjeearanya0910@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.14",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
